# Render Blueprint (example). Review plans/regions/prices before applying — applying creates PAID resources.
services:
  - type: web
    name: reserveflow
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: reserveflow-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false # e.g. https://reserveflow-xxxx.onrender.com or your own domain
      - key: EMAIL_DRIVER
        value: log # change to smtp after setting SMTP_URL / EMAIL_FROM
      - key: SMTP_URL
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ALLOW_SIGNUP
        value: "true" # set to "false" after creating your owner account
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
databases:
  - name: reserveflow-db
    region: singapore
    plan: basic-256mb
    postgresMajorVersion: "16"
